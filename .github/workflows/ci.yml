name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [g++, clang++]
        exclude:
          - os: macos-latest
            compiler: g++
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build tests
        run: ${{ matrix.compiler }} -std=c++17 -Wall -Wextra -Wpedantic -o test_clab tests/test_clab.cpp

      - name: Run tests
        run: ./test_clab

      - name: Build examples
        run: |
          ${{ matrix.compiler }} -std=c++17 -Wall -Wextra -o example_basic examples/basic.cpp
          ${{ matrix.compiler }} -std=c++17 -Wall -Wextra -o example_advanced examples/advanced.cpp
